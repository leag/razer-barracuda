[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "barracuda-pair"
version = "0.4.0"
description = "Linux pairing utility and battery driver for the Razer Barracuda X (2022) 2.4 GHz wireless dongle"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = []
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
barracuda-pair = "barracuda_pair.pairing:main"
barracuda-audio = "barracuda_pair.audio:main"

[tool.setuptools.packages.find]
include = ["barracuda_pair*"]

[tool.setuptools]
include-package-data = false
