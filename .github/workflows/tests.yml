name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q barracuda_status scripts
      - run: uv build
  qml:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm --needed qt6-declarative uv
      - run: uv run python -m unittest tests.test_plasmoid -v
  dkms-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner's cloud kernel lacks USB_HID, so build against the generic headers.
      - name: Install kernel headers
        run: sudo apt-get update && sudo apt-get install -y linux-headers-generic
      - run: make -C kernel/hid-razer-barracuda W=1 KDIR=$(ls -d /usr/src/linux-headers-*-generic | sort -V | tail -1)
  kunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y bc flex bison libelf-dev libssl-dev qemu-system-x86
      - name: Apply the series to HID for-next
        run: |
          git clone -q --depth 1 -b for-next https://git.kernel.org/pub/scm/linux/kernel/git/hid/hid.git linux
          git -C linux -c user.name=CI -c user.email=ci@invalid am "$PWD"/upstream/hid/000[12]-*.patch
      - name: Run KUnit
        working-directory: linux
        run: ./tools/testing/kunit/kunit.py run --arch=x86_64 --kunitconfig="$GITHUB_WORKSPACE/upstream/.kunitconfig" --jobs=$(nproc)
