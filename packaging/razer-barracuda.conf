; ALSA card profile set for the Razer Barracuda X (2022) dongle, USB 1532:0552.
; Selected by 89-razer-barracuda-acp.rules. The dongle carries one stereo
; stream, so the S/PDIF and AC3 profiles of the default set are left out, and
; the microphone uses the jack-aware Barracuda path.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = analog-output-headphones
direction = output
priority = 15

[Mapping analog-mono]
device-strings = hw:%f
channel-map = mono
paths-input = analog-input-headset-mic-razer-barracuda
direction = input
priority = 5
