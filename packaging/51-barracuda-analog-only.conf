# Razer Barracuda X (2022) dongle: offer only the analog profiles. With jack
# detection, an unplugged headset otherwise leaves an unused S/PDIF profile
# active and WirePlumber picks its sink instead of falling back.
monitor.alsa.rules = [
  {
    matches = [
      { device.vendor.id = "0x1532", device.product.id = "0x0552" }
    ]
    actions = {
      update-props = {
        device.profile-set = "analog-only.conf"
      }
    }
  }
]
