; Razer Barracuda X (2022) dongle, USB 1532:0552, with the snd-usb-audio
; jack quirk. The card's capture element is "Mic" and the wireless link is
; reported as "Headset Mic Jack"; the stock headset-mic path expects a
; "Headset Mic" element and the stock mic path knows no jack, so neither
; makes the microphone unavailable while the headset is off.

[General]
priority = 88
description-key = analog-input-microphone-headset

[Jack Headset Mic]
required-any = any

[Element Mic]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

.include analog-input-mic.conf.common
