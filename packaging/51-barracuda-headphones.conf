# Use the desktop theme's headphones icon for the Barracuda playback node.
# WirePlumber copies alsa.components to nodes before applying ALSA rules.
monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.components = "~(^| )USB1532:0552( |$)"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        device.icon-name = "audio-headphones"
      }
    }
  }
]
